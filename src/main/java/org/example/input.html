<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML with Table</title>
    <style>
        h1 {
            color: red;
            font-size: 28px;
        }
        p {
            font-size: 18px;
            line-height: 1.5;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: lightgray;
        }
    </style>
</head>
<body>
<h1>Welcome to My Page</h1>
<p>This is a simple example with a paragraph.</p>
<img src="C:\Users\aqiln\Desktop\inglab\openHTMLtoPDF\my_own_develop_pdf-modification\src\main\java\org\example\fire.jpeg" alt="Sample Image">

<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Country</th>
    </tr>
    <tr>
        <td>John Doe</td>
        <td>25</td>
        <td>USA</td>
    </tr>
    <tr>
        <td>Alice Smith</td>
        <td>30</td>
        <td>UK</td>
    </tr>
    <tr>
        <td>Aqil</td>
        <td>23</td>
        <td>MYR</td>
    </tr>
</table>
</body>
</html>
